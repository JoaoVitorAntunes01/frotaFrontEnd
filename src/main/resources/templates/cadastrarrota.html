
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Rota</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .form-control:invalid { box-shadow: none; }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg bg-dark navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <span class="bg-warning text-dark rounded px-2 py-1 me-2">A</span>Painel
        </a>
    </div>
</nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-7">

            <div class="card shadow-sm border-0">
                <div class="card-body p-4 p-md-5">

                    <a href="javascript:history.back()" class="btn btn-secondary">&larr; Voltar</a>

                    <h2 class="fw-bold mt-3 mb-1">Cadastrar rota</h2>
                    <p class="text-muted mb-4">Defina o trajeto e vincule um veículo e um motorista disponíveis</p>

                    <div class="alert alert-danger py-2 small" role="alert" th:if="${erro}" th:text="${erro}"></div>

                    <div th:if="${motoristas == null or motoristas.isEmpty() or veiculos == null or veiculos.isEmpty()}"
                         class="alert alert-warning py-2 small" role="alert">
                        Você precisa ter pelo menos um motorista e um veículo cadastrados para criar uma rota.
                    </div>

                    <form th:action="@{/rotas}" th:object="${rota}" method="post">

                        <h6 class="fw-semibold text-muted text-uppercase small mb-3">Trajeto</h6>

                        <div class="row">
                            <div class="col-6 mb-3">
                                <label for="cep_saida" class="form-label fw-semibold">CEP de saída</label>
                                <input type="text" class="form-control" id="cep_saida" th:field="*{cep_saida}"
                                       placeholder="Somente números" maxlength="10" required autofocus>
                            </div>
                            <div class="col-6 mb-3">
                                <label for="cep_destino" class="form-label fw-semibold">CEP de destino</label>
                                <input type="text" class="form-control" id="cep_destino" th:field="*{cep_destino}"
                                       placeholder="Somente números" maxlength="10" required>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-6 mb-3">
                                <label for="distancia" class="form-label fw-semibold">Distância</label>
                                <input type="text" class="form-control" id="distancia" th:field="*{distancia}"
                                       placeholder="Ex: 380km" required>
                            </div>
                            <div class="col-6 mb-3">
                                <label for="tempo_estimado" class="form-label fw-semibold">Tempo estimado</label>
                                <input type="text" class="form-control" id="tempo_estimado" th:field="*{tempo_estimado}"
                                       placeholder="Ex: 5h30">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-6 mb-3">
                                <label for="hora_saida" class="form-label fw-semibold">Data/hora de saída</label>
                                <input type="datetime-local" class="form-control" id="hora_saida" th:field="*{hora_saida}"
                                       required>
                            </div>
                            <div class="col-6 mb-3">
                                <label for="hora_chegada" class="form-label fw-semibold">Data/hora de chegada</label>
                                <input type="datetime-local" class="form-control" id="hora_chegada" th:field="*{hora_chegada}">
                                <div class="form-text">Deixe em branco se ainda não souber.</div>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="observacao" class="form-label fw-semibold">Observação</label>
                            <textarea class="form-control" id="observacao" th:field="*{observacao}" rows="2"
                                      placeholder="Detalhes da carga, instruções, etc."></textarea>
                        </div>

                        <h6 class="fw-semibold text-muted text-uppercase small mb-3">Veículo e motorista</h6>

                        <div class="mb-3">
                            <label for="id_veiculo" class="form-label fw-semibold">Veículo</label>
                            <select class="form-select" id="id_veiculo" th:field="*{id_veiculo}" required>
                                <option value="" disabled selected>Selecione um veículo...</option>
                                <option th:each="veiculo : ${veiculos}"
                                        th:value="${veiculo.id}"
                                        th:text="${veiculo.placa} + ' — ' + ${veiculo.modelo}">
                                </option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label for="id_motorista" class="form-label fw-semibold">Motorista</label>
                            <select class="form-select" id="id_motorista" th:field="*{id_motorista}" required>
                                <option value="" disabled selected>Selecione um motorista...</option>
                                <option th:each="motorista : ${motoristas}"
                                        th:value="${motorista.id}"
                                        th:text="${motorista.nome} + ' — ' + ${motorista.cpf}">
                                </option>
                            </select>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-warning btn-lg fw-semibold">Cadastrar rota</button>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
