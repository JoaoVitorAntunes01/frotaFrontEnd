<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veículos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg bg-dark navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <span class="bg-warning text-dark rounded px-2 py-1 me-2">A</span>Painel
        </a>
        <div class="ms-auto">
            <a th:href="@{/logout}" class="btn btn-danger fw-semibold">Sair</a>
        </div>
    </div>
</nav>

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <a href="javascript:history.back()" class="btn btn-secondary">&larr; Voltar</a>
            <h1 class="fw-bold mb-0 mt-1">Veículos</h1>
            <p class="text-muted mb-0">Todos os veículos cadastrados no sistema</p>
        </div>
        <a th:href="@{/veiculos/novo}" class="btn btn-warning fw-semibold px-4">
            + Cadastrar veículo
        </a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div th:if="${veiculos == null or veiculos.isEmpty()}" class="text-center py-5 text-muted">
                <p class="mt-3 mb-0">Nenhum veículo cadastrado ainda.</p>
                <a th:href="@{/veiculos/novo}" class="btn btn-warning fw-semibold mt-3">Cadastrar primeiro veículo</a>
            </div>
            <div th:if="${veiculos != null and !veiculos.isEmpty()}">
                <table class="table table-hover mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th class="px-4 py-3">Placa</th>
                            <th class="px-4 py-3">Modelo</th>
                            <th class="px-4 py-3">Ano</th>
                            <th class="px-4 py-3">Disponibilidade</th>
                            <th class="px-4 py-3">Quilometragem</th>
                            <th class="px-4 py-3">Chassi</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="veiculo : ${veiculos}">
                            <td class="px-4 py-3" th:text="${veiculo.placa}">—</td>
                            <td class="px-4 py-3" th:text="${veiculo.modelo}">—</td>
                            <td class="px-4 py-3" th:text="${veiculo.ano}">—</td>
                            <td class="px-4 py-3" th:text="${veiculo.disponibilidade}">—</td>
                            <td class="px-4 py-3" th:text="${veiculo.quilometragem}">—</td>
                            <td class="px-4 py-3" th:text="${veiculo.chassi}">—</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
