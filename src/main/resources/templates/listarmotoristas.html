<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motoristas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg bg-dark navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/home}">
            <span class="bg-warning text-dark rounded px-2 py-1 me-2">A</span>Painel
        </a>
        <div class="ms-auto">
            <a th:href="@{/logout}" class="btn btn-danger fw-semibold">Sair</a>
        </div>
    </div>
</nav>

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <a th:href="@{/home}" class="text-decoration-none text-muted small">&larr; Voltar</a>
            <h1 class="fw-bold mb-0 mt-1">Motoristas</h1>
            <p class="text-muted mb-0">Todos os motoristas cadastrados no sistema</p>
        </div>
        <a th:href="@{/motoristas/novo}" class="btn btn-warning fw-semibold px-4">
            + Cadastrar motorista
        </a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div th:if="${motoristas == null or motoristas.isEmpty()}" class="text-center py-5 text-muted">
                <p class="mt-3 mb-0">Nenhum motorista cadastrado ainda.</p>
                <a th:href="@{/motoristas/novo}" class="btn btn-warning fw-semibold mt-3">Cadastrar primeiro motorista</a>
            </div>
            <div th:if="${motoristas != null and !motoristas.isEmpty()}">
                <table class="table table-hover mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th class="px-4 py-3">Nome</th>
                            <th class="px-4 py-3">CPF</th>
                            <th class="px-4 py-3">Telefone</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="motorista : ${motoristas}">
                            <td class="px-4 py-3" th:text="${motorista.nome}">—</td>
                            <td class="px-4 py-3" th:text="${motorista.cpf}">—</td>
                            <td class="px-4 py-3" th:text="${motorista.telefone}">—</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
