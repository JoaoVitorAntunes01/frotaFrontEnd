
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark">

<div class="container-fluid vh-100 p-0">
    <div class="row g-0 h-100">

        <div class="col-md-5 col-lg-6 bg-warning d-none d-md-flex flex-column justify-content-between p-5">
            <div class="bg-dark rounded-3 d-flex align-items-center justify-content-center" style="width: 64px; height: 64px;">
                <span class="fw-bold fs-4 text-white">A</span>
            </div>

            <div>
                <h1 class="display-6 fw-bold mb-3 text-dark">Acesse sua conta</h1>
                <p class="fs-5 mb-0 text-dark">Gerencie tudo em um só lugar, com rapidez e segurança.</p>
            </div>

            <p class="small mb-0 text-dark">&copy; 2026 Antunes.</p>
        </div>

        <div class="col-12 col-md-7 col-lg-6 bg-white d-flex align-items-center justify-content-center p-4">
            <div class="w-100" style="max-width: 420px;">

                <div class="d-md-none text-center mb-4">
                    <div class="bg-dark rounded-3 d-inline-flex align-items-center justify-content-center mb-2" style="width: 64px; height: 64px;">
                        <span class="fw-bold fs-4 text-white">A</span>
                    </div>
                </div>

                <h2 class="fw-bold mb-1">Bem-vindo</h2>
                <p class="text-muted mb-4">Informe seus dados para entrar</p>

                <div class="alert alert-danger py-2 small" role="alert" th:if="${param.error}">
                    Usuário ou senha inválidos.
                </div>

                <form th:action="@{/login}" method="post">

                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold">Usuário</label>
                        <input type="email"
                               class="form-control form-control-lg"
                               id="username"
                               name="username"
                               placeholder="seu@email.com"
                               required
                               autofocus>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold">Senha</label>
                        <input type="password"
                               class="form-control form-control-lg"
                               id="password"
                               name="password"
                               placeholder="••••••••"
                               required>
                    </div>

                    <div class="d-grid mb-4 mt-2">
                        <button type="submit" class="btn btn-warning btn-lg fw-semibold">Entrar</button>
                    </div>

                </form>

                <div class="d-flex align-items-center mb-4">
                    <hr class="flex-grow-1">
                    <span class="px-3 small text-muted">ou</span>
                    <hr class="flex-grow-1">
                </div>

                <p class="text-center small text-muted mb-0">
                    Não tem uma conta?
                    <a href="#" class="link-warning fw-semibold text-decoration-none">Cadastre-se</a>
                </p>

            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
