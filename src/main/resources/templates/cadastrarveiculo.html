
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Veículo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .form-control:invalid { box-shadow: none; }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg bg-dark navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <span class="bg-warning text-dark rounded px-2 py-1 me-2">A</span>Painel
        </a>
    </div>
</nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">

            <div class="card shadow-sm border-0">
                <div class="card-body p-4 p-md-5">

                    <a href="javascript:history.back()" class="btn btn-secondary">&larr; Voltar</a>

                    <h2 class="fw-bold mt-3 mb-1">Cadastrar veículo</h2>
                    <p class="text-muted mb-4">Preencha os dados do veículo e da empresa responsável</p>

                    <div class="alert alert-danger py-2 small" role="alert" th:if="${erro}" th:text="${erro}"></div>

                    <form th:action="@{/veiculos}" th:object="${veiculo}" method="post">

                        <h6 class="fw-semibold text-muted text-uppercase small mb-3">Dados do veículo</h6>

                        <div class="mb-3">
                            <label for="placa" class="form-label fw-semibold">Placa</label>
                            <input type="text" class="form-control" id="placa" th:field="*{placa}"
                                   placeholder="ABC1D23" maxlength="10" required autofocus>
                        </div>

                        <div class="row">
                            <div class="col-6 mb-3">
                                <label for="ano" class="form-label fw-semibold">Ano</label>
                                <input type="text" class="form-control" id="ano" th:field="*{ano}"
                                       placeholder="2024" required>
                            </div>
                            <div class="col-6 mb-3">
                                <label for="modelo" class="form-label fw-semibold">Modelo</label>
                                <input type="text" class="form-control" id="modelo" th:field="*{modelo}"
                                       placeholder="Modelo do veículo" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="disponibilidade" class="form-label fw-semibold">Disponibilidade</label>
                            <select class="form-select" id="disponibilidade" th:field="*{disponibilidade}" required>
                                <option value="" disabled selected>Selecione...</option>
                                <option value="Disponível">Disponível</option>
                                <option value="Em rota">Em rota</option>
                                <option value="Manutenção">Manutenção</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="quilometragem" class="form-label fw-semibold">Quilometragem</label>
                            <input type="text" class="form-control" id="quilometragem" th:field="*{quilometragem}"
                                   placeholder="Km rodados" required>
                        </div>

                        <div class="mb-4">
                            <label for="chassi" class="form-label fw-semibold">Chassi</label>
                            <input type="text" class="form-control" id="chassi" th:field="*{chassi}"
                                   placeholder="Número do chassi" required>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-warning btn-lg fw-semibold">Cadastrar veículo</button>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
