
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg bg-dark navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <span class="bg-warning text-dark rounded px-2 py-1 me-2">A</span>Painel
        </a>
        <div class="ms-auto">
            <a th:href="@{/logout}" class="btn btn-danger fw-semibold">Sair</a>
        </div>
    </div>
</nav>

<div class="container py-5">

    <div class="mb-4">
        <h1 class="fw-bold mb-1">
            Olá<span th:if="${nome}" th:text="', ' + ${nome}"></span>!
        </h1>
        <p class="text-muted mb-0">Estas são as suas próximas viagens.</p>
    </div>

    <div th:if="${rotas == null or rotas.isEmpty()}" class="card border-0 shadow-sm">
        <div class="card-body p-4 p-md-5 text-center text-muted">
            <div class="bg-warning rounded-circle d-inline-flex align-items-center justify-content-center mb-3"
                 style="width: 64px; height: 64px;">
                <span class="fs-3">🗺️</span>
            </div>
            <p class="mb-0">Nenhuma viagem atribuída a você no momento.</p>
        </div>
    </div>

    <div class="row g-4" th:if="${rotas != null and !rotas.isEmpty()}">
        <div class="col-12 col-lg-6" th:each="rota : ${rotas}">
            <div class="card h-100 border-0 shadow-sm">
                <div class="card-body p-4">

                    <div class="d-flex justify-content-between align-items-start mb-3">
                        <h5 class="fw-bold mb-0">
                            <span th:text="${rota.cep_saida}">—</span>
                            &rarr;
                            <span th:text="${rota.cep_destino}">—</span>
                        </h5>
                        <span class="badge bg-warning text-dark" th:text="${rota.distancia}">—</span>
                    </div>

                    <table class="table table-sm table-borderless mb-3">
                        <tbody>
                            <tr>
                                <td class="text-muted small">Saída</td>
                                <td class="fw-semibold" th:text="${rota.hora_saida}">—</td>
                            </tr>
                            <tr>
                                <td class="text-muted small">Chegada prevista</td>
                                <td class="fw-semibold" th:text="${rota.hora_chegada} ?: 'A definir'">—</td>
                            </tr>
                            <tr>
                                <td class="text-muted small">Tempo estimado</td>
                                <td class="fw-semibold" th:text="${rota.tempo_estimado} ?: '—'">—</td>
                            </tr>
                            <tr>
                                <td class="text-muted small">Veículo</td>
                                <td class="fw-semibold">
                                    <span th:text="${rota.veiculo_placa}">—</span> —
                                    <span th:text="${rota.veiculo_modelo}">—</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>

                    <div th:if="${rota.observacao != null and !rota.observacao.isEmpty()}"
                         class="alert alert-light border py-2 small mb-0">
                        <strong>Observação:</strong> <span th:text="${rota.observacao}"></span>
                    </div>

                </div>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
