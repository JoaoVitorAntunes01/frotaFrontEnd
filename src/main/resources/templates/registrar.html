
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de empresa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>

        .form-control:invalid {
            box-shadow: none;
        }
    </style>
</head>
<body class="bg-dark">

<div class="container-fluid vh-100 p-0">
    <div class="row g-0 h-100">

        <div class="col-md-5 col-lg-6 bg-warning d-none d-md-flex flex-column justify-content-between p-5">
            <div class="bg-dark rounded-3 d-flex align-items-center justify-content-center" style="width: 64px; height: 64px;">
                <span class="fw-bold fs-4 text-white">A</span>
            </div>
            <div>
                <h1 class="display-6 fw-bold mb-3 text-dark">Cadastre sua empresa</h1>
                <p class="fs-5 mb-0 text-dark">Leva menos de um minuto para começar a gerenciar sua frota.</p>
            </div>
            <p class="small mb-0 text-dark">&copy; 2026 Antunes.</p>
        </div>

        <div class="col-12 col-md-7 col-lg-6 bg-white d-flex align-items-center justify-content-center p-4">
            <div class="w-100" style="max-width: 420px;">

                <div class="d-md-none text-center mb-4">
                    <div class="bg-dark rounded-3 d-inline-flex align-items-center justify-content-center mb-2" style="width: 64px; height: 64px;">
                        <span class="fw-bold fs-4 text-white">A</span>
                    </div>
                </div>

                <h2 class="fw-bold mb-1">Criar conta da empresa</h2>
                <p class="text-muted mb-4">Preencha os dados para cadastrar sua empresa</p>

                <div class="alert alert-danger py-2 small" role="alert" th:if="${erro}" th:text="${erro}"></div>

                <form th:action="@{/registro}" th:object="${empresa}" method="post">

                    <h6 class="fw-semibold text-muted text-uppercase small mb-3">Dados da empresa</h6>

                    <div class="mb-3">
                        <label for="nome" class="form-label fw-semibold">Nome da empresa</label>
                        <input type="text"
                               class="form-control form-control-lg"
                               id="nome"
                               th:field="*{nome}"
                               placeholder="Nome da empresa"
                               required
                               autofocus>
                    </div>

                    <div class="mb-3">
                        <label for="cnpj" class="form-label fw-semibold">CNPJ</label>
                        <input type="text"
                               class="form-control form-control-lg"
                               id="cnpj"
                               th:field="*{cnpj}"
                               placeholder="XXXXXXXX/XXXXXX"
                               maxlength="14"
                               required>
                    </div>

                    <div class="mb-3">
                        <label for="cep" class="form-label fw-semibold">CEP</label>
                        <input type="text"
                               class="form-control form-control-lg"
                               id="cep"
                               th:field="*{cep}"
                               placeholder="00000000"
                               maxlength="8"
                               required>
                    </div>

                    <h6 class="fw-semibold text-muted text-uppercase small mb-3 mt-4">Dados de acesso</h6>

                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">E-mail</label>
                        <input type="email"
                               class="form-control form-control-lg"
                               id="email"
                               th:field="*{email}"
                               placeholder="empresa@email.com"
                               required>
                    </div>

                    <div class="mb-3">
                        <label for="senha" class="form-label fw-semibold">Senha</label>
                        <input type="password"
                               class="form-control form-control-lg"
                               id="senha"
                               th:field="*{senha}"
                               placeholder="••••••••"
                               minlength="6"
                               required>
                    </div>

                    <div class="d-grid mb-4 mt-2">
                        <button type="submit" class="btn btn-warning btn-lg fw-semibold">Criar conta</button>
                    </div>

                </form>

                <p class="text-center small text-muted mb-0">
                    Já tem uma conta?
                    <a th:href="@{/login}" class="link-warning fw-semibold text-decoration-none">Entrar</a>
                </p>

            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
