
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Motorista</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .form-control:invalid { box-shadow: none; }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg bg-dark navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <span class="bg-warning text-dark rounded px-2 py-1 me-2">A</span>Painel
        </a>
    </div>
</nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">

            <div class="card shadow-sm border-0">
                <div class="card-body p-4 p-md-5">

                    <a href="javascript:history.back()" class="btn btn-secondary">&larr; Voltar</a>

                    <h2 class="fw-bold mt-3 mb-1">Cadastrar motorista</h2>
                    <p class="text-muted mb-4">Preencha os dados pessoais e de acesso do motorista</p>

                    <div class="alert alert-danger py-2 small" role="alert" th:if="${erro}" th:text="${erro}"></div>

                    <form th:action="@{/motoristas}" th:object="${motorista}" method="post">

                        <h6 class="fw-semibold text-muted text-uppercase small mb-3">Dados de acesso</h6>

                        <div class="mb-3">
                            <label for="nome" class="form-label fw-semibold">Nome</label>
                            <input type="text" class="form-control" id="nome" th:field="*{nome}"
                                   placeholder="Nome completo" required autofocus>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">E-mail</label>
                            <input type="email" class="form-control" id="email" th:field="*{email}"
                                   placeholder="motorista@email.com" required>
                        </div>

                        <div class="mb-4">
                            <label for="senha" class="form-label fw-semibold">Senha</label>
                            <input type="password" class="form-control" id="senha" th:field="*{senha}"
                                   placeholder="••••••••" minlength="6" required>
                        </div>

                        <h6 class="fw-semibold text-muted text-uppercase small mb-3">Dados do motorista</h6>

                        <div class="mb-3">
                            <label for="cpf" class="form-label fw-semibold">CPF</label>
                            <input type="text" class="form-control" id="cpf" th:field="*{cpf}"
                                   placeholder="Somente números" maxlength="11" required>
                        </div>

                        <div class="mb-4">
                            <label for="telefone" class="form-label fw-semibold">Telefone</label>
                            <input type="text" class="form-control" id="telefone" th:field="*{telefone}"
                                   placeholder="(00) 00000-0000" required>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-warning btn-lg fw-semibold">Cadastrar motorista</button>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
